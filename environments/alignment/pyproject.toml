[project]
name = "mvt-alignment-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["whisperx==3.8.6"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchaudio = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}
