name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up locked uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.4"
          python-version: "3.12"
          enable-cache: true
          cache-python: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install locked Python dependencies
        run: uv sync --locked --group dev

      - name: Ruff lint
        run: uv run --locked ruff check .

      - name: Ruff format check
        run: uv run --locked ruff format --check .

      - name: Schema drift check
        run: uv run --locked python scripts/export_schemas.py --check

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Enable Corepack and pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Install locked Node dependencies
        run: pnpm --dir renderer install --frozen-lockfile

      - name: Install pinned Playwright Chromium
        run: pnpm --dir renderer exec playwright install --with-deps chromium

      - name: Pytest
        run: uv run --locked pytest

  renderer:
    name: Renderer checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Enable Corepack and pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install locked Node dependencies
        run: pnpm --dir renderer install --frozen-lockfile

      - name: Install pinned Playwright Chromium
        run: pnpm --dir renderer exec playwright install --with-deps chromium

      - name: Build and test renderer
        run: pnpm --dir renderer check
