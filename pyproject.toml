[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "music-video-toolkit"
version = "0.1.0"
description = "Agent-facing music video toolkit: deterministic file contracts and execution"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["pydantic>=2.11,<3"]

[project.scripts]
mvt = "music_video_toolkit.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/music_video_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
